<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMap Canvas</title>
    
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f6f9; /* Un fond doux pour les yeux */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #network-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="network-canvas"></div>

    <script type="text/javascript">
        // 1. Définition des nœuds (Le point de départ)
        const nodes = new vis.DataSet([
            { 
                id: 1, 
                label: 'Mon Projet Créatif', 
                color: { background: '#4A90E2', border: '#357ABD' },
                shape: 'box',
                margin: 12,
                font: { color: '#ffffff', size: 16, face: 'Segoe UI' }
            }
        ]);

        // 2. Définition des liens (Vide pour l'instant)
        const edges = new vis.DataSet([]);

        // 3. Configuration du canvas
        const container = document.getElementById('network-canvas');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: {
                shadow: { enabled: true, color: 'rgba(0,0,0,0.1)', size: 4, x: 2, y: 2 }
            },
            physics: {
                enabled: false // Désactivé pour pouvoir placer les nœuds librement au drag & drop
            },
            interaction: {
                hover: true,
                dragNodes: true
            }
        };

        // 4. Initialisation du réseau graphique
        const network = new vis.Network(container, data, options);
    </script>
</body>
</html>
