name: Génération de la Release Mindy

on:
  push:
    tags:
      - 'v*' # Se déclenche uniquement pour les tags commençant par v (ex: v1.0.0)
  workflow_dispatch: # Permet de déclencher manuellement le workflow depuis l'interface GitHub

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest 
    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyInstaller

    - name: Compiler l'application
      run: |
        # 🚨 FIX AJUSTEMENT DES CHEMINS (app/main.py et app/templates)
        # Note : Si ton icon.ico est resté à la racine du projet, garde "icon.ico;.", s'il a migré dans app/, change en "app/icon.ico;."
        pyinstaller --name "Mindy" --noconfirm --onefile --windowed --icon="app/icon.ico" --add-data "app/icon.ico;." --add-data "app/templates;templates" app/main.py
      shell: pwsh

    - name: Créer l'archive Zip avec le nom du TAG
      run: |
        $VERSION = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "manual" }
        $ZIP_NAME = "Mindy_$VERSION.zip"
        
        # L'exécutable généré par PyInstaller atterrit toujours dans ./dist/ par rapport à la racine d'exécution
        Compress-Archive -Path dist/Mindy.exe -DestinationPath "./$ZIP_NAME"
      shell: pwsh

    - name: Créer la Release GitHub et téléverser l'artefact
      uses: softprops/action-gh-release@v2
      with:
        files: ./*.zip
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}