name: Génération de la Release Mindy

on:
  push:
    tags:
      - 'v*' # Se déclenche uniquement pour les tags commençant par v (ex: v1.0.0)
  workflow_dispatch: # Permet de déclencher manuellement le workflow depuis l'interface GitHub

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest 
    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyInstaller

    - name: Compiler l'application (PyInstaller)
      run: |
        pyinstaller --noconsole --onefile --name=Mindy main.py

    - name: Intégrer l'icône si elle existe
      run: |
        if (Test-Path "icon.ico") { Copy-Item "icon.ico" "dist/" }
      shell: pwsh

    - name: Créer l'archive Zip avec le nom du TAG
      run: |
        # Si c'est un tag (ex: v1.0.1), on prend le tag. Si c'est un lancement manuel, on met 'manual'
        $VERSION = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "manual" }
        $ZIP_NAME = "Mindy_$VERSION.zip"
        
        # On compresse le dossier dist dans le ZIP directement à la racine du projet
        Compress-Archive -Path dist/* -DestinationPath "./$ZIP_NAME"
      shell: pwsh

    - name: Créer la Release GitHub et téléverser l'artefact
      uses: softprops/action-gh-release@v2
      with:
        # On demande à l'action de prendre n'importe quel fichier .zip présent à la racine
        files: ./*.zip
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
